syntax = "proto3";

package proto;
option go_package = "./rpc";

service User {
    rpc Register(RegisterReq) returns (RegisterResp);
    rpc Login(LoginReq) returns (LoginResp);
    rpc GetUser(GetUserReq) returns (GetUserResp);
}

message RegisterReq {
    string username = 1;
    string password = 2;
    string nickname = 3;
}
message RegisterResp { int64 user_id = 1; }

message LoginReq {
    string username = 1;
    string password = 2;
}
message LoginResp {
    int64 user_id = 1;
    string token = 2;
}

message GetUserReq { int64 user_id = 1; }
message GetUserResp {
    int64 user_id = 1;
    string username = 2;
    string nickname = 3;
}
